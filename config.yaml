# All parameters and paths. Scripts read only from here.

event_set:
  repo: ../kenya-flood-eventset                     # event-set repo (tag v1, seed 20261117, 10,000 years)
  config: ../kenya-flood-eventset/config.yaml       # read only for simulation.regions (outlet_id -> region)
  sites: ../kenya-flood-eventset/data/interim/sites.parquet
  site_qc: ../kenya-flood-eventset/data/interim/site_qc.parquet
  event_rp: ../kenya-flood-eventset/results/event_rp.parquet
  events_sim: ../kenya-flood-eventset/results/events_sim.parquet
  n_years: 10000
  lambda: 5.74                                      # historical events per year (264 / 46)
  qc_max_zero_share: 0.4                            # must match the event-set config, to identify modelled sites
  qc_min_mean_flow_m3s: 2

zones:
  hydrobasins: data/raw/hydrobasins/hybas_af_lev10_v1c.shp   # Africa, level 10 (check level 12 later)
  kenya_boundary: ../kenya-flood-eventset/data/raw/geobounds_KEN.geojson
  max_site_distance_km: 150                         # start; beyond this a unit uses the fallback rule
  up_area_ratio_bounds: [0.5, 2]                    # site upstream area / unit UP_AREA; outside this, 01 snaps the site to a nearby unit
  site_snap_km: 5                                   # search radius for snapping a site to a unit (about one GloFAS cell)
  fallback: nearest_in_region                       # nearest_in_region | independent (03 also runs the other as a bracket)

hazard:
  source: giri                                      # giri | jrc | fathom
  rps: [2, 5, 10, 25, 50, 100, 200, 500, 1000]      # return periods available for the chosen source
  path_pattern: data/raw/hazard/giri/KEN_giri-flood_RP{rp}.tif   # set to the real file names once downloaded
  depth_to_m: 0.01
  depth_threshold_m: 0                              # a cell counts as flooded above this depth
  below_lowest_rp: zero                             # exposure below the lowest mapped RP is zero (biases AAL low; report it)
  deep_water_check_m: 10                            # 02 prints exposure in cells deeper than this (lakes in the maps)

exposure:
  kind: population
  path: data/raw/exposure/KEN_ghs-pop_2020.tif   
  year: 2020

events:
  rp_floor: 2                                       # event_rp only holds rows with rp_years >= 2
  interpolation: log_rp                             # interpolate exposure linearly in log(return period)
  dependence_modes: [full, independent_fallback]    # full: every zone copies its site; independent_fallback: fallback zones draw their own RP
  seed: 20261120

validation:
  emdat: data/raw/emdat/emdat_kenya_floods.csv      # EM-DAT export: Kenya, floods; columns year and total_affected
  emdat_years: [2000, 2024]
  n_samples: 1000
  emdat_year_col: "Start Year"
  emdat_affected_col: "Total Affected"

event_maps:
  events: []                       # event_ids to map; pick from 04's printout
  oep_rps: [50, 100, 250]          # 04 prints candidate events near these OEP return periods
  out_dir: results/event_maps      # depth GeoTIFFs
  figures_dir: figures/event_maps  # PNGs
  summary: results/event_maps_summary.csv

files:
  zones: results/zones.parquet
  zones_map: figures/zones.png
  site_placement: results/site_placement.csv
  zone_exposure: results/zone_exposure_rp.parquet
  zone_aal_maps: results/zone_aal_from_maps.parquet
  event_losses: results/event_losses.parquet
  year_losses: results/year_losses.parquet
  metrics: results/metrics.parquet
  figures: figures
